name: CI

on:
  # Pull requests only, and not while a PR is a draft: checks run once the PR is marked
  # ready (or on a push to a ready PR), so the minutes go on the code about to merge.
  # No run on push to main: it would repeat the run the merged PR just passed.
  # workflow_dispatch allows a manual run from the Actions tab.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, lockfile-enforced)
        run: npm ci

      - name: Generate Next.js route types
        # A fresh checkout has no .next/types, so without this step tsc never
        # checks route handlers and page props against Next's constraints.
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # tests/db/*.sql tests skip without TEST_DATABASE_URL. Keep it that way:
        # Vercel previews share the production database, so CI gets no DB URL.
        run: npm test

  migrate-runner:
    # Runs scripts/migrate_prod.sh (the runner migrate.yml calls on merge) against a throwaway
    # Postgres service container that exists only for this job. It is never the production
    # database: the URL below is the container's own, and the tests refuse any non-local host.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Migration runner (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # A missing URL must fail this job, not skip the tests.
      MIGRATE_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, lockfile-enforced)
        run: npm ci

      - name: Make sure psql is installed
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql --version

      - name: Migration runner tests
        run: npx tsx --test tests/migrate-prod-script.test.ts
